<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <title>Travel & Car Questionnaire</title>

</head> 
<body> 
    <h1>What is your favorite place to travel?</h1> 
    <p>I am building a directory of the sweetest travel destinations.</p>  

    <form name="travel" onsubmit="identifyUser(event)">
        What is your favorite travel destination?
        <input name="destination" required="" size="81" type="text"/> 
        <br><br> 
        Any recommendations (cool things to do, places to visit or restaurants to eat)? 
        <br><br> 
        <textarea cols="81" name="details" required="" rows="6"></textarea> 
        <br><br> 
        Name: <input name="fullname" required="" size="75" type="text"/> 
        <br><br> 
        Email: <input name="email" required="" size="75" type="email"/> 
        <br><br>
        <input name="submit" type="submit" value="Submit Form"/>
    </form> 

    <hr style="margin: 30px 0;">

    <!-- Car Selection Section -->
    <h2>Which car would you like to purchase?</h2>
    <div id="car-options">
        <button type="button" onclick="selectCar('Hyundai')">Hyundai</button>
        <button type="button" onclick="selectCar('Suzuki')">Suzuki</button>
        <button type="button" onclick="selectCar('Tata')">Tata</button>
    </div>

    <!-- Segment Tracking Script -->
    <script>
    // Handles Form Submit -> analytics.identify() & analytics.track()
    function identifyUser(e) {
      e.preventDefault();
      
      var form = e.target;
      var email = form.elements['email'].value;
      var name = form.elements['fullname'].value;
      var destination = form.elements['destination'].value;
      var details = form.elements['details'].value;

      analytics.identify(email, {
        name: name,
        email: email
      });

      analytics.track('Form Submitted', {
        favorite_destination: destination,
        recommendations: details
      });

      alert('Form submitted! Identify and track events sent to Segment.');
      form.reset();
    }

    // Handles Car Button Clicks -> analytics.track()
    function selectCar(carBrand) {
      analytics.track('Car Selected', {
        brand: carBrand
      });

      alert('You selected ' + carBrand + '! Event tracked in Segment.');
    }
    </script>
</body> 
</html>
